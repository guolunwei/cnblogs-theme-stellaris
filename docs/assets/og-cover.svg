<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="星轨 Stellaris · 博客园主题">
  <defs>
    <radialGradient id="glow" cx="50%" cy="-18%" r="72%">
      <stop offset="0" stop-color="#5E6AD2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5E6AD2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 画布：与主题 --xm-bg 同值，近黑而非纯黑 -->
  <rect width="1200" height="630" fill="#08090A"/>
  <!-- 单一顶部靛蓝光晕，与 body::before 同构 -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 品牌符号：轨道环 + 中心节点，单色系两级靛蓝，无星芒、无双色 -->
  <g transform="translate(80 265) scale(6.66667)">
    <ellipse cx="12" cy="12" rx="10" ry="4.6" transform="rotate(-32 12 12)" fill="none" stroke="#5E6AD2" stroke-width="1.7"/>
    <circle cx="12" cy="12" r="2.6" fill="#8B93FF"/>
  </g>

  <text x="284" y="338" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="72" font-weight="640" letter-spacing="-1.5" fill="#F7F8F8">星轨 Stellaris</text>
  <text x="288" y="392" font-family="'JetBrains Mono',Consolas,monospace" font-size="20" letter-spacing="4.5" fill="#8A8F98">STAR ORBIT · CNBLOGS THEME</text>

  <!-- 右下角 1px 靛蓝发丝线，替代旧版双色轨道段 -->
  <line x1="860" y1="530" x2="1120" y2="530" stroke="#1C1E21" stroke-width="1"/>
  <circle cx="1120" cy="530" r="3" fill="#8B93FF"/>
</svg>
